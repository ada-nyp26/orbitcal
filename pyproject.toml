[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitcal"
version = "0.1.0"
description = "A Python package implementing Gauss–Newton nonlinear least-squares optimisation, applied to exoplanet orbital parameter estimation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas Pung", email = "nypung@outlook.com" }]
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "flake8"]

[tool.setup.packages.find]
where = ["src"]
